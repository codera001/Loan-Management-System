<div class="modal fade" id="customerNew" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Add new Customer</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <form method="POST" action="{% url 'cms:add'%}">
                {% csrf_token %}

                <div class="modal-body">
                    <div class="row g-3">

                        <div class="col-md-12">
                            <label for="name" class="form-label">
                              Business  Name
                            </label>
                            <input
                                type="text"
                                name="customers_name"
                                class="form-control"
                                id="name"
                               >
                        </div>

                        <div class="col-md-12">
                            <label for="email" class="form-label">
                                Email
                            </label>
                            <input
                                type="email"
                                name="customers_email"
                                class="form-control"
                                id="email"
                                >
                        </div>

                        <div class="col-md-12">
                            <label for="phone{{ customer.id }}" class="form-label">
                                Phone Number
                            </label>
                            <input
                                type="text"
                                name="customers_phone"
                                class="form-control"
                                id="phone"
                                >
                        </div>

                    </div>
                </div>

                <div class="modal-footer">
                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary">
                        Add
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>
