<div class="modal fade" id="customerModal{{ customer.id }}" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">{{customer.customers_name}}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <form method="POST" action="{% url 'cms:update' customer.id %}">
                {% csrf_token %}

                <div class="modal-body">
                    <div class="row g-3">

                        <div class="col-md-12">
                            <label for="name{{ customer.id }}" class="form-label">
                              Business  Name
                            </label>
                            <input
                                type="text"
                                name="customers_name"
                                class="form-control"
                                id="name{{ customer.id }}"
                                value="{{ customer.customers_name }}">
                        </div>

                        <div class="col-md-12">
                            <label for="email{{ customer.id }}" class="form-label">
                                Email
                            </label>
                            <input
                                type="email"
                                name="customers_email"
                                class="form-control"
                                id="email{{ customer.id }}"
                                value="{{ customer.customers_email }}">
                        </div>

                        <div class="col-md-12">
                            <label for="phone{{ customer.id }}" class="form-label">
                                Phone Number
                            </label>
                            <input
                                type="text"
                                name="customers_phone"
                                class="form-control"
                                id="phone{{ customer.id }}"
                                value="{{ customer.customers_phone }}">
                        </div>

                    </div>
                </div>

                <div class="modal-footer">
                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary">
                        Save Changes
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>
