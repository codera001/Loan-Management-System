<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.1/css/all.css" integrity="sha384-gfdkjb5BdAXd+lj+gudLWI+BXq4IuLW5IT+brZEZsLFm++aCMlF1V92rMkPaX4PP" crossorigin="anonymous">
    <title>Loan Management System {% block title %} {% endblock %}</title>
    {% block head %}{% endblock %}
  </head>
  <body>
    <div class="container-fluid">
      <div class="row flex-nowrap">
    
        {% block sidebar %}{% endblock %}
    
        <div class="col py-3">
          {% block content %}{% endblock %}
        </div>
    
      </div>
    </div>
    <!-- <script src="https://kit.fontawesome.com/1b90b49694.js" crossorigin="anonymous"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
        /* Because i didnt set placeholder values in forms.py they will be set here using vanilla Javascript
		//We start indexing at one because CSRF_token is considered and input field 
		 */
</script>
<script>
		//Query All input fields
    var form_fields = document.getElementsByTagName('input')

for (var i = 0; i < form_fields.length; i++) {

    if (form_fields[i].name == 'username') {
        form_fields[i].placeholder = 'Username..'
    }

    if (form_fields[i].name == 'email') {
        form_fields[i].placeholder = 'Email..'
    }

    if (form_fields[i].name == 'password') {
        form_fields[i].placeholder = 'Password...'
    }

    if (form_fields[i].name == 'password1') {
        form_fields[i].placeholder = 'Enter password...'
    }

    if (form_fields[i].name == 'password2') {
        form_fields[i].placeholder = 'Re-enter Password...'
    }

    form_fields[i].className += ' form-control'
}
    </script>
    
  </body>
</html>
